workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

stages:
  - verify
  - sign
  - publish

default:
  # Android 34 / build-tools 34.0.0; immutable multi-platform image.
  image: ghcr.io/cirruslabs/android-sdk:34@sha256:1c2e7e9c4490dbc1f85364556aa08e550945e6dffb29baab86d5fe2c7be0773a
  interruptible: true

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

publisher_tests:
  stage: verify
  image: python:3.12-slim
  script:
    - python -m unittest discover -s ci/tests -v

verify:
  stage: verify
  timeout: 45 minutes
  script:
    - &verify_build |
      set -euo pipefail
      java -version
      sdk_revision=3f924ee6aaface69d9b10e1981f390ee9502b945
      git init .sdk-source
      git -C .sdk-source remote add origin https://github.com/aegorsuch/weartak-plugin-sdk.git
      git -C .sdk-source -c credential.helper= fetch --depth 1 origin "$sdk_revision"
      git -C .sdk-source checkout --detach FETCH_HEAD
      test "$(git -C .sdk-source rev-parse HEAD)" = "$sdk_revision"
      (
        cd .sdk-source
        bash ./gradlew --no-daemon testDebugUnitTest testReleaseUnitTest assembleDebug assembleRelease
      )
      mkdir -p app/libs
      cp .sdk-source/build/outputs/aar/weartak-plugin-sdk-debug.aar app/libs/
      cp .sdk-source/build/outputs/aar/weartak-plugin-sdk-release.aar app/libs/
      bash ./gradlew --no-daemon \
        :app:testDebugUnitTest :app:testReleaseUnitTest \
        :app:assembleDebug :app:assembleRelease \
        :app:lintDebug :app:lintRelease
  artifacts:
    when: always
    expire_in: 14 days
    reports:
      junit:
        - app/build/test-results/testDebugUnitTest/TEST-*.xml
        - app/build/test-results/testReleaseUnitTest/TEST-*.xml
        - .sdk-source/build/test-results/testDebugUnitTest/TEST-*.xml
        - .sdk-source/build/test-results/testReleaseUnitTest/TEST-*.xml
    paths:
      - app/build/reports/tests/
      - app/build/reports/lint-results-debug.html
      - app/build/reports/lint-results-debug.xml
      - app/build/reports/lint-results-release.html
      - app/build/reports/lint-results-release.xml
      - .sdk-source/build/reports/tests/

main_release:
  stage: sign
  timeout: 45 minutes
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_PATH == "weartak-plugins/weartak-plugin-gotenna" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
  script:
    - *verify_build
    - |
      set +x
      set -euo pipefail
      test "$CI_SERVER_HOST" = "git.tak.gov"
      test "$CI_PROJECT_PATH" = "weartak-plugins/weartak-plugin-gotenna"
      test "$CI_PIPELINE_SOURCE" = "push"
      test "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH"
      test "$CI_COMMIT_REF_PROTECTED" = "true"
      if [ "${CI_DEBUG_TRACE:-false}" = "true" ]; then
        echo "ERROR: Production signing refuses debug tracing." >&2
        exit 1
      fi
      for name in WEARTAK_RELEASE_KEYSTORE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
        if [ -z "${!name:-}" ]; then
          echo "ERROR: Missing inherited production signing input: $name" >&2
          exit 1
        fi
      done
      umask 077
      mkdir .production-signing
      trap 'rm -f .production-signing/weartak.keystore .production-signing/signing.properties .production-signing/certificate.txt .production-signing/manifest.txt; rmdir .production-signing' EXIT
      printf '%s' "$WEARTAK_RELEASE_KEYSTORE_B64" | base64 --decode > .production-signing/weartak.keystore
      printf '%s\n' 'RELEASE_KEYSTORE_FILE=weartak.keystore' > .production-signing/signing.properties
      export WEARTAK_SIGNING_PROPERTIES="$CI_PROJECT_DIR/.production-signing/signing.properties"
      export WEARTAK_RELEASE_KEYSTORE_FILE="$CI_PROJECT_DIR/.production-signing/weartak.keystore"
      export WEARTAK_RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
      export WEARTAK_RELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS"
      export WEARTAK_RELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
      bash ./gradlew --no-daemon :app:assembleRelease
      apk=app/build/outputs/apk/release/app-release.apk
      test -f "$apk"
      tools="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/34.0.0"
      "$tools/apksigner" verify --verbose --print-certs "$apk" > .production-signing/certificate.txt
      expected=1579b600cd84e619e76a91c2db6b031938c999bc2aad926b9a51ec2b166d348d
      actual="$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' .production-signing/certificate.txt | tr '[:upper:]' '[:lower:]')"
      if [ "$actual" != "$expected" ]; then
        echo "ERROR: Release signer does not match Sextant/LACE production certificate." >&2
        exit 1
      fi
      "$tools/aapt" dump xmltree "$apk" AndroidManifest.xml > .production-signing/manifest.txt
      if grep 'A: android:debuggable(' .production-signing/manifest.txt | grep -qv '=(type 0x12)0x0$'; then
        echo "ERROR: Refusing debuggable production APK." >&2
        exit 1
      fi
      mkdir verified-release
      cp "$apk" verified-release/weartak-plugin-gotenna-release.apk
      printf '%s\n' "$actual" > verified-release/signer-sha256.txt
      (cd verified-release && sha256sum weartak-plugin-gotenna-release.apk > SHA256SUMS)
      cp app/build/outputs/apk/release/output-metadata.json verified-release/
      printf '{"project_id":"%s","pipeline_id":"%s","pipeline_iid":%s,"source_sha":"%s","pipeline_url":"%s"}\n' \
        "$CI_PROJECT_ID" "$CI_PIPELINE_ID" "$CI_PIPELINE_IID" "$CI_COMMIT_SHA" "$CI_PIPELINE_URL" \
        > verified-release/provenance.json
      rm -f .production-signing/certificate.txt .production-signing/manifest.txt
      echo "Production APK verified against Sextant/LACE signer."
  after_script:
    - rm -f .production-signing/weartak.keystore .production-signing/signing.properties .production-signing/certificate.txt .production-signing/manifest.txt
    - if [ -d .production-signing ]; then rmdir .production-signing; fi
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - verified-release/

publish_github_main:
  stage: publish
  image: python:3.12-slim
  dependencies:
    - main_release
  resource_group: gotenna-github-main
  interruptible: false
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
  script:
    - python ci/publish_github_release.py
  rules:
    - if: '$CI_SERVER_HOST == "git.tak.gov" && $CI_PROJECT_PATH == "weartak-plugins/weartak-plugin-gotenna" && $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
